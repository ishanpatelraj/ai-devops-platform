version: "3.9"

# ─────────────────────────────────────────
#  NexusOps – AI DevOps Platform
#  docker-compose.yaml
# ─────────────────────────────────────────

networks:
  nexusops-net:
    driver: bridge

volumes:
  mongo-data:
  ml-models:

services:

  # ── 1. MongoDB ───────────────────────────
  mongo:
    image: mongo:7.0
    container_name: nexusops-mongo
    restart: unless-stopped
    networks:
      - nexusops-net
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"          # expose only in dev; remove in prod
    environment:
      MONGO_INITDB_DATABASE: devops-monitor
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── 2. ML Service (FastAPI) ──────────────
  ml-service:
    build:
      context: ./ml-services
      dockerfile: Dockerfile
    container_name: nexusops-ml
    restart: unless-stopped
    networks:
      - nexusops-net
    ports:
      - "8000:8000"
    volumes:
      - ml-models:/app/saved_models
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── 3. Backend (Node / Express) ──────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusops-backend
    restart: unless-stopped
    networks:
      - nexusops-net
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URL: mongodb://mongo:27017/devops-monitor
      JWT_SECRET: ${JWT_SECRET:-ai_devops_super_secret_jwt_key_2026}
      JWT_EXPIRE: 7d
      ML_SERVICE_URL: http://ml-service:8000
      CLIENT_URL: http://localhost:80
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 4. Frontend (Vite → Nginx) ───────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
    container_name: nexusops-frontend
    restart: unless-stopped
    networks:
      - nexusops-net
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

  # ── 5. Nginx Reverse Proxy ───────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nexusops-nginx
    restart: unless-stopped
    networks:
      - nexusops-net
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  # ── 6. Monitoring Agent (Python) ─────────
  monitoring-agent:
    build:
      context: ./monitoring-agent
      dockerfile: Dockerfile
    container_name: nexusops-agent
    restart: unless-stopped
    networks:
      - nexusops-net
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:5000
    # The agent reads host metrics – give it access to the host network stats
    # via privileged mode (optional, remove if not needed)
    # privileged: true
